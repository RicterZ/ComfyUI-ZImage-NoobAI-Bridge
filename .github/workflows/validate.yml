name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python nodes
        run: python -m py_compile __init__.py nodes.py
      - name: Validate example workflows
        run: python -m json.tool example_workflows/z-image-openpose-noobai-flat-2x.json >/dev/null
